[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdisk-writer-agent"
version = "0.1.0"
description = "Google ADK maintenance agent demo for AgentDisk OKF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AgentDisk T6" },
]
dependencies = [
    "google-adk>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adk_writer_agent*"]
exclude = ["scenarios*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scenarios"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ['scenarios/']
